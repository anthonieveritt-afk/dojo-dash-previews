.q{font-size:26px;text-align:center;margin:8px 0 14px;min-height:40px}
.big{font-size:56px;font-weight:900;text-align:center;font-style:italic;text-shadow:3px 3px 0 var(--gold)}
.kanji{font-size:30px;text-align:center;color:#555;min-height:36px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}

<script id="jpnum">
// ---- Japanese number rules (romaji, Hepburn without long-vowel marks, hyphenated) ----
var JP = (function(){
  var D = ['', 'ichi','ni','san','yon','go','roku','nana','hachi','kyu']; // compound forms
  var K = ['', '一','二','三','四','五','六','七','八','九'];
  // units-digit alternatives accepted as correct
  var ALT = {4:['shi','yon'],7:['shichi','nana'],9:['ku','kyu']};
  var UNIT_MAIN = {1:'ichi',2:'ni',3:'san',4:'shi',5:'go',6:'roku',7:'shichi',8:'hachi',9:'ku'};
  var HUND = {1:'hyaku',2:'ni-hyaku',3:'san-byaku',4:'yon-hyaku',5:'go-hyaku',6:'roppyaku',7:'nana-hyaku',8:'happyaku',9:'kyu-hyaku'};
  var THOU = {1:'sen',2:'ni-sen',3:'san-zen',4:'yon-sen',5:'go-sen',6:'roku-sen',7:'nana-sen',8:'hassen',9:'kyu-sen'};
  function parts(n){ // returns array of prefix words + units digit
    var p=[], t=Math.floor(n/1000), h=Math.floor(n%1000/100), te=Math.floor(n%100/10), u=n%10;
    if(t) p.push(THOU[t]); if(h) p.push(HUND[h]);
    if(te) p.push(te===1?'ju':D[te]+'-ju');
    return {p:p,u:u};
  }
  function forms(n){ // all accepted romaji spellings; first = main form shown
    var r=parts(n), base=r.p.join('-');
    if(!r.u) return [base];
    var alts = ALT[r.u] ? (r.p.length? [ALT[r.u][1],ALT[r.u][0]] : ALT[r.u]) : [UNIT_MAIN[r.u]];
    return alts.map(function(a){return base? base+'-'+a : a;});
  }
  function word(n){ var f=forms(n); return n<=10 && ALT[n] ? ALT[n].join(' / ') : f[0]; }
  function kanji(n){
    var t=Math.floor(n/1000), h=Math.floor(n%1000/100), te=Math.floor(n%100/10), u=n%10, s='';
    if(t) s+=(t>1?K[t]:'')+'千'; if(h) s+=(h>1?K[h]:'')+'百'; if(te) s+=(te>1?K[te]:'')+'十'; if(u) s+=K[u];
    return s;
  }
  function speak(n){ return kanji(n); } // ja-JP voices read kanji/numerals correctly
  return {forms:forms, word:word, kanji:kanji, speak:speak};
})();
if (typeof module !== 'undefined') module.exports = JP;
</script>

var LEVELS=[{max:10,belt:'Yellow',c:'#ffeb3b'},{max:15,belt:'Orange',c:'#ff9800'},{max:20,belt:'Green',c:'#43a047'},{max:25,belt:'Blue',c:'#1e88e5'},{max:40,belt:'Purple',c:'#8e24aa'},{max:100,belt:'Brown',c:'#6d4c41'},{max:1000,belt:'Black',c:'#111'}];
var KEY='dojoDashNumbers.v1', save={passed:[],best:{}}, opts={kanji:true,audio:true};
try{var s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s){save=s.save||save;opts=s.opts||opts;}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({save:save,opts:opts}));}catch(e){}}
var $=function(id){return document.getElementById(id)};
function show(id){['home','study','quiz','result'].forEach(function(s){$(s).classList.toggle('hide',s!==id)});window.scrollTo(0,0);}
var voice=null, canSpeak='speechSynthesis' in window;
function pickVoice(){ if(!canSpeak) return; var v=speechSynthesis.getVoices().filter(function(v){return /^ja/i.test(v.lang)}); voice=v[0]||null; }
if(canSpeak){pickVoice(); speechSynthesis.onvoiceschanged=pickVoice;}
function say(n){ if(!opts.audio||!canSpeak) return; try{speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(JP.speak(n)); u.lang='ja-JP'; if(voice)u.voice=voice; u.rate=.85; speechSynthesis.speak(u);}catch(e){} }
function audioOK(){ return opts.audio && canSpeak && !!voice; }
var actx=null; function beep(f,d){ if(!opts.audio) return; try{actx=actx||new (window.AudioContext||window.webkitAudioContext)(); var o=actx.createOscillator(),g=actx.createGain(); o.frequency.value=f; g.gain.value=.08; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+(d||.12));}catch(e){} }
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
// Sensible sampling for each level; 1-1000 favours round numbers and the sound-change numbers
function sample(max){
  if(max<=40) return rnd(1,max);
  if(max===100){ var r=Math.random(); return r<.25? rnd(1,10)*10 : r<.35? 100 : rnd(11,99); }
  var r2=Math.random(), special=[300,600,800,1000,100,400,700,900,350,680,888,603,1000];
  if(r2<.3) return rnd(1,10)*100;
  if(r2<.5) return special[rnd(0,special.length-1)];
  if(r2<.7) return rnd(10,99)*10;
  return rnd(101,999);
}
function distractors(n,max){ var s={}; s[n]=1; var out=[n], tries=0;
  var near=[n+1,n-1,n+10,n-10,n+100,n-100,n*2,Math.floor(n/2)];
  while(out.length<4 && tries++<200){ var c = tries<20? near[rnd(0,near.length-1)] : sample(max); if(c>=1&&c<=max&&!s[c]){s[c]=1;out.push(c);} }
  return shuffle(out);
}
function renderHome(){
  $('optKanji').checked=opts.kanji; $('optAudio').checked=opts.audio; $('sound').textContent=opts.audio?'🔊':'🔇';

var stList=[],stI=0;

function nextQ(){

  else if(t==='listen'){ $('qType').textContent='Listen and pick'; $('qBig').textContent='👂'; $('qText').textContent='Which number did you hear?'; $('replay').classList.remove('hide'); $('replay').onclick=function(){say(num)}; say(num); drawOpts(ch,labelN); }
  else { $('qType').textContent='Count the kiai punches!'; $('arena').classList.remove('hide'); $('qText').textContent='Watch and count…'; $('opts').innerHTML=''; punches(num,function(){ $('qText').textContent='How many punches? Answer in Japanese!'; $('replay').classList.remove('hide'); $('replay').onclick=function(){$('opts').innerHTML='';punches(num,function(){drawOpts(ch,labelW)})}; drawOpts(ch,labelW); }); }
  if(t!=='w2n') $('qBig').style.fontSize='';
}
function punches(n,done){ var i=0; (function step(){ if(i>=n){ setTimeout(done,350); return; } i++; $('fist').classList.add('hit'); $('kiai').classList.add('on'); beep(320+i*20,.09);
  setTimeout(function(){ $('fist').classList.remove('hit'); $('kiai').classList.remove('on'); setTimeout(step,420); },260); })(); }
function drawOpts(ch,label){ $('opts').innerHTML=ch.map(function(c){return '<button class="opt" data-v="'+c+'">'+label(c)+'</button>'}).join('');
  [].forEach.call(document.querySelectorAll('.opt[data-v]'),function(b){b.onclick=function(){answer(b)}}); }
function answer(b){ var ok=+b.dataset.v===Q.cur.n; [].forEach.call(document.querySelectorAll('.opt[data-v]'),function(x){x.disabled=true; if(+x.dataset.v===Q.cur.n) x.classList.add('right');});
  if(ok){Q.score++; beep(880,.15);} else {b.classList.add('wrong'); beep(160,.25);}
  $('qText').textContent=(ok?'Oss! ':'It was ')+Q.cur.n+' = '+JP.forms(Q.cur.n).join(' / '); say(Q.cur.n);
  setTimeout(nextQ, ok?1100:2200); }
function finish(){ var i=Q.lvl, L=LEVELS[i], pass=Q.score>=8; save.best[i]=Math.max(save.best[i]||0,Q.score);
  if(pass && save.passed.indexOf(i)<0) save.passed.push(i); persist();
  $('rTitle').textContent=pass?'OSS! 🎉':'Keep going!'; $('rTitle').style.color=pass?L.c:'';
  $('rText').innerHTML='You scored '+Q.score+'/10. '+(pass?'You earned the <b>'+L.belt+'</b> badge <span class="badge" style="background:'+L.c+'"></span>'+(i<LEVELS.length-1?' and unlocked 1 – '+LEVELS[i+1].max+'!':' — you can count to 1000!'):'Get 8 to earn the '+L.belt+' badge.');
  show('result'); }
$('rAgain').onclick=function(){startQuiz(Q.lvl)}; $('rHome').onclick=function(){renderHome();show('home')};
renderHome();
// test hook
window.__dd={JP:JP,LEVELS:LEVELS,sample:sample,state:function(){return {Q:Q,save:save}}};
</script></body></html>
