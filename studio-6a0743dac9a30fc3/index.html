<!doctype html><html lang="en"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Forza Technique Studio · Forza Karate Club</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0f141a;color:#e8eef3;font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;touch-action:none}
#app{display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto 1fr auto;height:100%}
header{grid-column:1/3;display:flex;align-items:center;gap:8px;padding:6px 10px;background:#b71c1c;flex-wrap:wrap}header h1{font-size:17px;margin:0 10px 0 0}
#vw{position:relative;min-height:0}#view{width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:8px;top:8px;background:#000a;padding:4px 8px;border-radius:6px;font-size:12px;pointer-events:none}
aside{grid-row:2/4;grid-column:2;overflow-y:auto;background:#17202a;padding:8px;border-left:1px solid #263238;touch-action:pan-y}
#tl{grid-column:1;background:#121a22;padding:6px 8px;border-top:1px solid #263238}
#track{width:100%;height:46px;display:block;border-radius:6px;touch-action:none;cursor:pointer}
button,select,input{font:inherit;color:#e8eef3;background:#263544;border:1px solid #37474f;border-radius:6px;padding:5px 8px;min-height:32px}button{cursor:pointer}button:active{background:#37474f}
header button{background:#8e1515;border-color:#d32f2f}
fieldset{border:1px solid #2c3a47;border-radius:8px;margin:0 0 8px;padding:6px 8px}legend{color:#ffcc80;font-weight:600;padding:0 4px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:3px 0}.row label{min-width:62px;color:#b0bec5}
input[type=range]{flex:1;min-width:120px;padding:0;height:30px}
.key{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:3px;border-radius:6px;margin:2px 0;background:#1d2833}.key.on{outline:2px solid #ffd54f}.key input{width:86px}.key input[type=number]{width:70px}.key button{min-width:30px;padding:3px 6px}
.lib{display:grid;grid-template-columns:1fr auto auto auto;gap:4px;align-items:center;padding:4px;background:#1d2833;border-radius:6px;margin:3px 0}.lib small{grid-column:1;color:#90a4ae;font-size:11px}.lib b{grid-column:1}.lib button{grid-row:1/3}
#keys{max-height:150px;overflow-y:auto}#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#2e7d32;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none}
@media (max-width:820px),(orientation:portrait){#app{grid-template-columns:1fr;grid-template-rows:auto 48vh auto 1fr}header{grid-column:1}aside{grid-row:4;grid-column:1;border-left:0}#tl{grid-row:3}}

<header><h1>🥋 Forza Technique Studio</h1>
<button data-view="front">Front</button><button data-view="side">Side</button><button data-view="top">Top</button><button data-view="opponent">Opponent view</button>
<button id="bUndo" title="Undo (Ctrl+Z)">↶ Undo</button><button id="bRedo" title="Redo (Ctrl+Y)">↷ Redo</button><span style="margin-left:auto;font-size:12px;opacity:.85">Forza Karate Club</span></header>
<div id="vw"><canvas id="view"></canvas><div id="hud">Selected: <b id="selName">–</b> · tap a yellow joint · drag rings to rotate · drag empty space to orbit · pinch/scroll to zoom</div></div>
<aside>

<div class="row"><button id="bMode">Mode: Rotate joint</button><button id="bReset">Reset to kamae</button><button id="bMirror">Mirror L↔R</button></div>
<div class="row"><label>X (roll)</label><input type="range" id="sx" step="1"><span id="vx"></span></div>
<div class="row"><label>Y (twist)</label><input type="range" id="sy" step="1"><span id="vy"></span></div>

<div class="row"><label>Root Y</label><input type="range" id="ry" min="-50" max="30"><span id="vry"></span></div>

<script>/* Forza Technique Studio – game-side loader (Forza Karate Club, Dojo Dash).
   Plain JS with no dependencies. Works in the browser (window.ForzaTechniqueLoader) and in Node (module.exports).

   values used by the v11/v12 kumite fighters: hip, lean, ff/bf (front/back ankle), lh/rh (lead/rear fist),

 {name:'spine',parent:'pelvis',offset:[0,0.10,0]},
 {name:'chest',parent:'spine',offset:[0,0.22,0]},
 {name:'neck',parent:'chest',offset:[0,0.25,0]},

 {name:'shoulderL',parent:'chest',offset:[0,0.20,-0.19]},{name:'elbowL',parent:'shoulderL',offset:[0,-0.30,0]},{name:'wristL',parent:'elbowL',offset:[0,-0.27,0]},

</script>
