  for(let k=0;k<40;k++){const a=k*0.157+frame*.01;g.fillStyle=['#ffd600','#ff4081','#40c4ff','#69f0ae'][k%4];g.fillRect(W/2+Math.cos(a*3)*(200+k*9)%W*.5,((k*53+frame*3)%H),8,8)}
  txt(M?'👑 MASTERY LEVEL '+(mlvl-1)+' CLEARED! 👑':fin?'🥋 OSS! You reached the DOJO! 🥋':'🎉 GRADING PASSED! 🎉',W/2,90,M||fin?38:46,'#ffd600');
  txt(M?'Black Belt Mastery – still a':'You are now:',W/2,140,26,'#fff');txt(G.n.toUpperCase(),W/2,178,G.n.length>20?28:34,'#fff');txt(G.k||'',W/2,206,22,'#80deea');
  beltIcon(W/2-125,240,G,5);

  txt('Stage bonus: +'+msg.bonus+'   Lives: +'+lives*100+(msg.fr?'   Friends: +'+msg.fr:'')+'   Score: '+score,W/2,475,20,'#fff');if(msg.nf)txt('👫 New member'+(msg.nf>1?'s':'')+'! x'+msg.nf+' joined Forza Karate Club',W/2,452,20,'#69f0ae');
  if(world&&world.cnt!=null)txt(world.cnt===5?'🔢 You counted ichi, ni, san, shi, go! +500':'🔢 Counted in Japanese: '+(world.cnt?NUMS.slice(0,world.cnt).map(n=>n.r).join(', '):'none yet')+' – find all 5 next time!',W/2,114,15,world.cnt===5?'#69f0ae':'#ffcc80');txt(M?'Next: Mastery Level '+mlvl+' – even harder!':fin?'':'Next: '+LEVELS[stageIdx+1].name,W/2,505,18,'#ffcc80');if(msg.t<200&&frame%60<40)txt('Tap / SPACE to continue',W/2,532,16,'#fff')}
 if(state==='over'||state==='win'||state==='dailydone'){g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,W,H);txt(state==='dailydone'?'📅 Daily Challenge done! 🔥 Streak '+ST.streak:state==='win'?'🥋 BLACK BELT! OSS! 🥋':mode==='mastery'?'Mastery run over – level '+mlvl:mode==='daily'?'Daily Challenge failed – try again!':'Late for karate! ('+short(GRADES[bestGrade])+')',W/2,70,46,state==='win'?'#ffd600':'#ff5252');
  txt('Score: '+score+'   Time: '+fmt(totalTime),W/2,108,24,'#fff');board(125);if(frame%60<40)txt('Press SPACE / ENTER or tap for the menu',W/2,H-20,24,'#fff')}
 drawToasts();

const nb=document.getElementById('nameBox'),nick=document.getElementById('nick'),nick2=document.getElementById('nick2');
function askName(){nb.style.display='flex';document.getElementById('finalScore').textContent=(mode==='daily'?'📅 Daily '+TODAY+' • ':mode==='mastery'?'👑 Mastery level '+mlvl+' • ':'')+'Score: '+score+' • Time: '+fmt(totalTime)+' • Belt: '+curBeltG(bestGrade).n+(curBeltG(bestGrade).k?' ('+curBeltG(bestGrade).k+')':'');nick.value=localStorage.getItem('dojoDashNick')||rndNick();nick.placeholder=TWO?'Player 1 nickname':'';nick2.style.display=TWO?'inline-block':'none';nick2.value=rndNick();setTimeout(()=>{nick.focus();nick.select()},50)}
function closeName(){nb.style.display='none';anyPressed=0;for(const k in K)K[k]=0;for(const k in K2)K2[k]=0}
document.getElementById('rnd').onclick=()=>{nick.value=rndNick();nick2.value=rndNick()};
document.getElementById('save').onclick=()=>{if(!nickOK(clean(nick.value))||(TWO&&!nickOK(clean(nick2.value))))return;const n1=clean(nick.value)||rndNick(),n=TWO?n1+' & '+(clean(nick2.value)||rndNick()):n1;try{localStorage.setItem('dojoDashNick',n1)}catch(e){}addLB(n,score,totalTime,bestGrade,mode==='mastery'?Math.max(1,mlvl-(state==='stageclear'?1:0)):undefined);closeName()};
document.getElementById('skip').onclick=closeName;
nick2.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')document.getElementById('save').click()});
nick.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')document.getElementById('save').click()});
// ---------- loop ----------
let last=performance.now(),acc=0;
const trialEl=document.getElementById('trial'),foPad=document.getElementById('touchFO'),t2El=document.getElementById('touch2');
const kmPad=document.getElementById('touchKM');document.querySelectorAll('#touchKM .fb').forEach(b=>{const k=b.dataset.k,on=e=>{e.preventDefault();kmInput(k,1)},off=e=>{e.preventDefault();if(k!=='a')kmInput(k,0)};b.addEventListener('touchstart',on,{passive:false});b.addEventListener('touchend',off,{passive:false});b.addEventListener('touchcancel',off);b.addEventListener('mousedown',on);b.addEventListener('mouseup',off);b.addEventListener('mouseleave',off)});
document.querySelectorAll('#touchFO .fb').forEach(b=>{const h=e=>{e.preventDefault();foInput(b.dataset.d)};b.addEventListener('touchstart',h,{passive:false});b.addEventListener('mousedown',h)});
function loop(t){if(isTouch){const fo=state==='faceoff',km=state==='kumite';foPad.style.display=fo?'flex':'none';kmPad.style.display=km?'flex':'none';touchEl.style.display=fo||km||TWO?'none':'flex';t2El.style.display=!fo&&!km&&TWO?'flex':'none'}trialEl.style.display=(state==='over'||state==='win'||state==='dailydone')&&nb.style.display!=='flex'?'block':'none';acc+=Math.min(100,t-last);last=t;while(acc>=1000/60){update();acc-=1000/60}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
